project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "*.md"
    - "!deprecated/"

execute:
  freeze: auto

website:
  title: "Examined Algorithms"
  description: The personal website of Nathaniel Forde
  reader-mode: true
  navbar:
    left:
      - text: Writing
        href: blog.qmd
      - text: Open Source Projects
        href: opensource.qmd
      - text: Talks
        href: talks.qmd
      - text: Consulting
        href: consulting.qmd
      - text: Bayesian Causal Inference
        href: https://bayesian-causal-inference.com/
      - text: CV
        href: cv.qmd
      - icon: github
        href: https://github.com/NathanielF
      - icon: bluesky
        href: https://bsky.app/profile/nathanielforde.bsky.social


  
  sidebar:
    title: Notes
    pinned: false
    collapse-level: 1
    style: docked
    contents: notes/certain_things/Public/**

format:
  html:
    theme: flatly
    css: styles.css
    toc: false
    page-layout: full
    googlefonts:
      - Montserrat
      - Lora
    include-after-body: script.js


exclude:
  - "posts/deprecated/"

